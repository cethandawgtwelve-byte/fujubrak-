<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dominic Fike - Kick the Buddy</title>
  <!-- Load the self-hosted Ruffle JavaScript -->
  <script src="ruffle/ruffle.js"></script>
  <!-- Load Discord Embedded App SDK -->
  <script src="https://unpkg.com/@discord/embedded-app-sdk"></script>
  <style>
    /* Make the game fill the page and remove scrollbars */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }
    /* Wrapper the SDK will manage */
    #discord-app-container {
      width: 100%;
      height: 100%;
    }
    #game-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- SDK container -->
  <div id="discord-app-container">
    <!-- Ruffle renders SWF here -->
    <div id="game-container"></div>
  </div>

  <script>
    // Initialize Discord Embedded App SDK
    const client = new Discord.Client();
    client.initialize();

    // Initialize Ruffle inside the SDK container
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    document.getElementById("game-container").appendChild(player);

    // Load your SWF
    player.load("buddy.swf");
  </script>
</body>
</html>
