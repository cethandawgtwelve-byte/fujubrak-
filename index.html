<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kick the Buddy</title>

  <!-- Official stable Ruffle CDN -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: black;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #game-container {
      flex: 1; /* fill remaining space */
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* ===============================
       RESET BUTTON OPTION (optional)
       Remove this block to disable reset
    ================================ */
    #reset-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      padding: 6px 12px;
      font-size: 14px;
      background: #5865F2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.8;
    }

    #reset-btn:hover {
      opacity: 1;
    }
    /* END RESET BUTTON OPTION */
  </style>
</head>
<body>

  <div id="game-container"></div>

  <!-- ===============================
       RESET BUTTON OPTION (optional)
       Remove this block to disable reset
  ================================ -->
  <button id="reset-btn">Reset Game</button>
  <!-- END RESET BUTTON OPTION -->

  <script>
    const container = document.getElementById("game-container");

    // Global player reference to keep one instance
    let player;
    let ruffle;

    function startRuffle() {
      // If player already exists, just reload the SWF internally
      if (player) {
        player.load("buddy.swf");
        return;
      }

      ruffle = window.RufflePlayer.newest();
      player = ruffle.createPlayer();

      container.appendChild(player);

      // Fullscreen scaling
      player.style.width = "100%";
      player.style.height = "100%";
      player.fit = "scale";

      // Keyboard focus
      player.tabIndex = 1;
      player.focus();

      // Load SWF
      player.load("buddy.swf");

      // Audio resume for Discord + Chrome policies
      document.addEventListener("click", () => {
        if (player.audio_context?.state === "suspended") {
          player.audio_context.resume();
        }
      });
    }

    // Delayed startup so Discord iframe has size
    requestAnimationFrame(() => {
      setTimeout(startRuffle, 150);
    });

    // ===============================
    // RESET BUTTON FUNCTIONALITY (optional)
    // Remove this block to disable reset
    // ===============================
    document.getElementById("reset-btn").addEventListener("click", () => {
      if (player) player.load("buddy.swf");
    });
    // END RESET BUTTON FUNCTIONALITY

  </script>

</body>
</html>
