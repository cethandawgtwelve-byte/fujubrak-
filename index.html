<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kick the Buddy</title>

  <!-- Official stable Ruffle CDN -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: black;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      height: 100%;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <script>
    const container = document.getElementById("game-container");

    function startRuffle() {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();

      container.innerHTML = "";
      container.appendChild(player);

      player.style.width = "100%";
      player.style.height = "100%";
      player.fit = "scale";

      player.tabIndex = 1;
      player.focus();

      player.load("buddy.swf");

      // Required for Discord + Chrome audio policies
      document.addEventListener("click", () => {
        if (player.audio_context?.state === "suspended") {
          player.audio_context.resume();
        }
      });
    }

    // 🔑 Delay startup so Discord iframe has size
    requestAnimationFrame(() => {
      setTimeout(startRuffle, 150);
    });
  </script>

</body>
</html>
