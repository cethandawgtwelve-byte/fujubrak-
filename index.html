<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dominic Fike - Kick the Buddy</title>

  <!-- Self-hosted Ruffle JS -->
  <script src="ruffle/ruffle.js"></script>

  <style>
    /* Fullscreen for HTML, body, and containers */
    html, body, #discord-app-container, #game-container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
    }

    /* Canvas scaling */
    canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <!-- Discord wrapper optional -->
  <div id="discord-app-container">
    <div id="game-container"></div>
  </div>

  <script>
    // ========================
    // Initialize Ruffle with custom WASM files
    // ========================
    const ruffle = window.RufflePlayer.newest({
      wasm_path: "ruffle/c7e6a88989fc130dfbcf.wasm",      // your main WASM
      wasm_asm_path: "ruffle/4065c68d6800df78f899.wasm"   // your asm fallback
    });

    const player = ruffle.createPlayer();
    const container = document.getElementById("game-container");
    container.appendChild(player);

    // Force canvas scaling
    player.style.width = "100%";
    player.style.height = "100%";
    player.fit = "scale";

    // Ensure canvas can receive keyboard input
    player.tabIndex = 1;
    player.focus();

    // ========================
    // Load SWF
    // ========================
    player.load("buddy.swf");

    // Resume audio on first click (Chrome autoplay)
    document.addEventListener("click", () => {
      if (player.audio_context && player.audio_context.state === "suspended") {
        player.audio_context.resume();
      }
    });
  </script>
</body>
</html>
