<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kick the Buddy</title>

  <!-- ✅ Stable Ruffle CDN build -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: black;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      height: 100%;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <script>
    // Create Ruffle player
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    const container = document.getElementById("game-container");
    container.appendChild(player);

    // Fullscreen scaling
    player.style.width = "100%";
    player.style.height = "100%";
    player.fit = "scale";

    // Keyboard focus
    player.tabIndex = 1;
    player.focus();

    // Load SWF (must be in repo root)
    player.load("buddy.swf");

    // Fix browser audio autoplay restriction
    document.addEventListener("click", () => {
      if (player.audio_context?.state === "suspended") {
        player.audio_context.resume();
      }
    });
  </script>

</body>
</html>
